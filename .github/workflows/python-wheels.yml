# Python wheels for agx-py, published to PyPI as `agx-py` (import name
# stays `agx`). The bare `agx` name on PyPI belongs to an unrelated
# project.
#
# Matrix: linux-x86_64, linux-aarch64, macos-arm64, windows-x86_64.
# Uses maturin-action for cross-compilation and consistent manylinux
# policies. abi3-py310 means one wheel per platform (not per Python
# minor version), cutting the matrix down substantially.
#
# Trigger: the `agx-core-v*` tag release-plz pushes when agx-core is
# released. The bindings version in lockstep with agx-core — the wheel
# version is stamped from that tag at build time, so it can't drift
# from the core crate it wraps. Also exposed as `workflow_dispatch` to
# build wheels without publishing, to spot-check the matrix.
#
# Publishing uses PyPI Trusted Publishing (OIDC) — no API token. One-
# time setup on pypi.org: add a pending publisher for project `agx-py`
# with owner `brevity1swos`, repository `agx`, workflow
# `python-wheels.yml`, environment `pypi`.
#
# Security review: no untrusted `github.event.*` input is consumed in
# `run:` commands. The tag name reaches the shell only through `env:`,
# and only users with push access can create tags.

name: python-wheels

on:
  push:
    tags:
      - 'agx-core-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: linux-aarch64, os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { name: macos-arm64, os: macos-14, target: aarch64-apple-darwin }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Stamp version from agx-core tag
        if: startsWith(github.ref, 'refs/tags/agx-core-v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          export VERSION="${TAG#agx-core-v}"
          perl -pi -e '$n += s/^version = "[^"]*"/version = "$ENV{VERSION}"/ unless $n' crates/agx-py/Cargo.toml
          grep -m1 '^version' crates/agx-py/Cargo.toml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          manylinux: auto
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path crates/agx-py/Cargo.toml
          sccache: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Stamp version from agx-core tag
        if: startsWith(github.ref, 'refs/tags/agx-core-v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          export VERSION="${TAG#agx-core-v}"
          perl -pi -e '$n += s/^version = "[^"]*"/version = "$ENV{VERSION}"/ unless $n' crates/agx-py/Cargo.toml
          grep -m1 '^version' crates/agx-py/Cargo.toml
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/agx-py/Cargo.toml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: dist

  publish:
    if: startsWith(github.ref, 'refs/tags/agx-core-v')
    runs-on: ubuntu-latest
    needs: [wheels, sdist]
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true
