name: Release

on:
  push:
    branches: [main]

permissions:
  pull-requests: write
  contents: write

# Back-to-back pushes to main must not run release-plz concurrently —
# two runs racing to open the release PR or push tags can publish
# twice or leave a half-made release. Queue instead of cancelling.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # RELEASE_PLZ_TOKEN must be a PAT, not GITHUB_TOKEN: tags pushed
      # with GITHUB_TOKEN don't trigger other workflows, and the
      # `agx-core-v*` tag is what starts the PyPI / npm builds.
      - uses: MarcoIeni/release-plz-action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
