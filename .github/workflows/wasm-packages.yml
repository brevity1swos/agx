# WASM packages for agx-wasm, published to npm as `agx-wasm`.
#
# Three targets (web / nodejs / bundler) each produce a separate
# `pkg/` directory. The `bundler` variant is published as the
# canonical npm package; `web` and `nodejs` ship as artifacts.
#
# Trigger: the `agx-core-v*` tag release-plz pushes when agx-core is
# released. Like agx-py, the package versions in lockstep with
# agx-core — stamped from the tag at build time.
#
# Publishing uses npm Trusted Publishing (OIDC) — no token secret. npm
# attaches provenance automatically. One-time setup: the package must
# exist on npm first (the very first version is published by hand), then
# on npmjs.com add a trusted publisher for `agx-wasm` with owner
# `brevity1swos`, repository `agx`, workflow `wasm-packages.yml`,
# environment `npm`. Requires Node >= 22.14 and npm >= 11.5.1.
#
# Security review: no untrusted `github.event.*` input is consumed in
# `run:` commands. `matrix.target` is a static string from this file,
# and the tag name reaches the shell only through `env:`.

name: wasm-packages

on:
  push:
    tags:
      - 'agx-core-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [web, nodejs, bundler]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Stamp version from agx-core tag
        if: startsWith(github.ref, 'refs/tags/agx-core-v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          export VERSION="${TAG#agx-core-v}"
          perl -pi -e '$n += s/^version = "[^"]*"/version = "$ENV{VERSION}"/ unless $n' crates/agx-wasm/Cargo.toml
          grep -m1 '^version' crates/agx-wasm/Cargo.toml
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: wasm-pack
      - name: Build WASM package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cd crates/agx-wasm
          wasm-pack build --target "$TARGET" --release --out-dir "pkg-$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agx-wasm-${{ matrix.target }}
          path: crates/agx-wasm/pkg-${{ matrix.target }}

  publish:
    if: startsWith(github.ref, 'refs/tags/agx-core-v')
    runs-on: ubuntu-latest
    needs: [build]
    environment: npm
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agx-wasm-bundler
          path: pkg
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Node 22 bundles npm 10; trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11.21.0
      - name: Publish to npm
        working-directory: pkg
        run: npm publish --access public
